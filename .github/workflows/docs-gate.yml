name: Docs Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run docs gate (pull_request)
        if: github.event_name == 'pull_request'
        run: npm run docs:check -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Run docs gate (push)
        if: github.event_name == 'push'
        run: npm run docs:check -- --base "${{ github.event.before }}" --head "${{ github.sha }}"
